<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Экран курьера</title>
<meta name="description" content="Рабочий прототип мотивационного слоя для курьеров: движок правил считает состояние из журнала событий.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%232DBE64%27/%3E%3Cpath d=%27M46 14c0 18-11 26-24 26M22 40c0-13 9-20 24-26M15 50c2-4 4-6 7-8%27 stroke=%27white%27 stroke-width=%274.5%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Golos+Text:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="root"></div>
<script data-cfasync="false">
// Сторож: если основной скрипт не запустился или упал, страница говорит об
// этом текстом — вместо молчаливо мёртвых кнопок. Написан на ES5 и без
// модулей, чтобы выполниться даже там, где модульный скрипт не выжил.
(function () {
  var box = null;
  function show(msg) {
    if (!box) {
      box = document.createElement('div');
      box.setAttribute('style',
        'position:fixed;top:0;left:0;right:0;z-index:99;background:#B00F3E;color:#fff;'
        + 'font:13px/1.45 system-ui,sans-serif;padding:10px 14px;text-align:center');
      document.body.appendChild(box);
    }
    box.textContent = msg;
  }
  var firstError = null;
  window.addEventListener('error', function (e) {
    if (!firstError) {
      firstError = e.message || 'неизвестная ошибка';
      show('Ошибка на странице: ' + firstError + ' — обновите страницу (Ctrl+Shift+R) и, если повторится, пришлите этот текст.');
    }
  });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.childElementCount === 0 && !firstError) {
        show('Приложение не запустилось: браузер не выполнил скрипт страницы. Обновите страницу; если не поможет — откройте в Chrome или Safari.');
      }
    }, 2500);
  });
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
