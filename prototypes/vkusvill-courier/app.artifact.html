<title>Экран курьера</title>
<meta name="description" content="Концепт мотивационного слоя в приложении курьера: пять экранов в трёх состояниях.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* ─────────────────────────────  ТОКЕНЫ  ─────────────────────────────
   Светлая палитра проверена на контраст: все текстовые пары ≥ 4.5:1.
   Курьер смотрит в телефон на улице, в солнце — запас здесь не роскошь. */
:root{
  --green:#2DBE64;
  --green-deep:#0E6B36;
  --green-soft:#DCF3E5;
  --green-line:#B6E3C8;

  --amber:#8A5000;
  --amber-solid:#D98B1F;
  --amber-soft:#FCF0DC;
  --amber-line:#EFD7AC;

  --berry:#B00F3E;
  --berry-soft:#FBE3E9;

  --ink:#12251A;
  --ink-2:#3D5147;
  --ink-3:#5C7367;
  --paper:#E7EEE6;
  --surface:#FFFFFF;
  --surface-2:#F8FBF7;
  --line:#DFE8DF;
  --line-soft:#EDF2EC;

  --shell:#0D1711;
  --shell-edge:#2A3B31;
  --on-green:#FFFFFF;

  --display:"Unbounded","Golos Text","Helvetica Neue",Arial,sans-serif;
  --text:"Golos Text","Helvetica Neue",Arial,sans-serif;

  --r-md:16px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#3FDA7C; --green-deep:#8FEDB5; --green-soft:#123222; --green-line:#215C3B;
    --amber:#F2C078; --amber-solid:#E9A94A; --amber-soft:#2E220E; --amber-line:#4B3A18;
    --berry:#FF6089; --berry-soft:#3B1220;
    --ink:#E9F3EB; --ink-2:#AAC2B2; --ink-3:#8AA294;
    --paper:#070D09; --surface:#121E17; --surface-2:#17271D;
    --line:#26382D; --line-soft:#1D2E23;
    --shell:#000000; --shell-edge:#31463A;
    --on-green:#08160E;
  }
}
:root[data-theme="dark"]{
  --green:#3FDA7C; --green-deep:#8FEDB5; --green-soft:#123222; --green-line:#215C3B;
  --amber:#F2C078; --amber-solid:#E9A94A; --amber-soft:#2E220E; --amber-line:#4B3A18;
  --berry:#FF6089; --berry-soft:#3B1220;
  --ink:#E9F3EB; --ink-2:#AAC2B2; --ink-3:#8AA294;
  --paper:#070D09; --surface:#121E17; --surface-2:#17271D;
  --line:#26382D; --line-soft:#1D2E23;
  --shell:#000000; --shell-edge:#31463A;
  --on-green:#08160E;
}

/* ─────────────────────────────  СЦЕНА  ───────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;
  background:var(--paper);color:var(--ink);
  font-family:var(--text);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:22px 16px 28px;
}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Шапка стенда */
.deck{display:flex;flex-direction:column;align-items:center;gap:12px;flex:none}
.stamp{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 13px 6px 10px;border-radius:100px;
  background:var(--berry-soft);color:var(--berry);
  font-size:11.5px;font-weight:600;line-height:1.3;text-align:center;
}
.stamp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.profiles{
  display:inline-flex;gap:3px;padding:4px;border-radius:100px;
  background:var(--surface);border:1px solid var(--line);
}
.profile{
  padding:7px 15px;border-radius:100px;
  font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;
  transition:background .18s ease,color .18s ease;
}
.profile:hover{color:var(--ink-2)}
.profile[aria-pressed="true"]{background:var(--green-soft);color:var(--green-deep)}

/* ─────────────────────────────  ТЕЛЕФОН  ───────────────────────────── */
.phone{
  flex:none;width:384px;
  background:var(--shell);border:1px solid var(--shell-edge);
  border-radius:48px;padding:11px;
  box-shadow:0 2px 4px rgba(18,37,26,.06), 0 34px 70px -24px rgba(18,37,26,.38);
}
.app{
  position:relative;height:760px;
  background:var(--surface-2);border-radius:38px;overflow:hidden;
  display:flex;flex-direction:column;isolation:isolate;
}

@media (max-width:719px){
  body{padding:0;gap:0;justify-content:flex-start;height:100dvh;overflow:hidden}
  .deck{width:100%;gap:0}
  .phone{width:100%;border:0;border-radius:0;padding:0;box-shadow:none;flex:1;min-height:0;display:flex}
  .app{height:auto;flex:1;min-height:0;border-radius:0;width:100%}
  .stamp{width:100%;justify-content:center;border-radius:0;padding:6px 12px;font-size:10.5px}
  .stamp__more{display:none}
  .profiles{
    width:100%;border-radius:0;border-width:0 0 1px;padding:5px 8px;
    justify-content:center;gap:4px;background:var(--surface);
  }
  .profile{padding:6px 10px;font-size:11.5px}
  .hint{display:none}
  .status{padding-top:max(10px, env(safe-area-inset-top))}
  .tabbar{padding-bottom:max(15px, env(safe-area-inset-bottom))}
}
@media (min-width:720px) and (max-height:940px){
  .app{height:min(760px, calc(100dvh - 190px))}
}

.hint{font-size:12.5px;color:var(--ink-3);text-align:center;max-width:44ch;flex:none}
.hint kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:1px 6px;color:var(--ink-2)}

/* Статус-бар */
.status{flex:none;display:flex;align-items:center;justify-content:space-between;padding:13px 24px 6px;font-size:12.5px;font-weight:600}
.status__icons{display:flex;gap:5px;align-items:center;opacity:.85}
.status__icons i{display:block;width:15px;height:10px;border:1.4px solid currentColor;border-radius:3px}
.status__icons i:first-child{width:4px;height:9px;border-width:0;border-radius:1px;background:currentColor}
.status__icons i:nth-child(2){
  width:10px;height:9px;border-width:0;background:currentColor;
  clip-path:polygon(0 100%,35% 100%,35% 55%,0 55%,0 100%,50% 100%,50% 25%,100% 25%,100% 100%);
}

/* Шапка приложения */
.appbar{flex:none;padding:6px 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.appbar__title{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.03em}
.appbar__sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.avatar{
  width:38px;height:38px;border-radius:13px;flex:none;
  background:var(--green-soft);color:var(--green-deep);
  display:grid;place-items:center;border:1px solid var(--green-line);
  font-family:var(--display);font-weight:600;font-size:15px;
}

/* Область экранов */
.viewport{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 20px;scrollbar-width:thin}
.viewport::-webkit-scrollbar{width:5px}
.viewport::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.screen{display:flex;flex-direction:column;gap:12px;animation:slide .32s cubic-bezier(.22,1,.36,1) both}
@keyframes slide{from{opacity:0;transform:translateX(var(--from,10px))}to{opacity:1;transform:none}}

/* ── Карточки ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card--flat{border-color:var(--line-soft)}
.card--green{background:var(--green-soft);border-color:var(--green-line)}
.card--warn{background:var(--amber-soft);border-color:var(--amber-line)}
.card__label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.card--green .card__label{color:var(--green-deep)}
.card--warn .card__label{color:var(--amber)}
.card__title{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.02em;margin-top:7px}
.card__title--lg{font-size:20px}
.card__note{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.45}

.live{display:flex;align-items:center;gap:11px}
.live__dot{width:9px;height:9px;border-radius:50%;flex:none;position:relative;color:var(--green);background:currentColor}
.live__dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;opacity:.4;animation:pulse 2.4s ease-out infinite}
.card--warn .live__dot{color:var(--amber-solid)}
@keyframes pulse{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.25);opacity:0}}
.live__text{font-size:13.5px;font-weight:600}
.live__meta{font-size:12.5px;color:var(--ink-3);margin-left:auto}

/* Кольцо */
.ring-row{display:flex;align-items:center;gap:18px;margin-top:14px}
.ring{width:106px;height:106px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring__track{stroke:var(--line);stroke-width:9;fill:none}
.ring__fill{
  stroke:var(--green);stroke-width:9;fill:none;stroke-linecap:round;
  stroke-dasharray:283;stroke-dashoffset:283;
  transition:stroke-dashoffset 1.15s cubic-bezier(.22,1,.36,1) .15s;
}
.ring--warn .ring__fill{stroke:var(--amber-solid)}
.ring.is-drawn .ring__fill{stroke-dashoffset:var(--dash,60)}
.ring__center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring__big{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ring__small{font-size:10.5px;color:var(--ink-3);margin-top:4px;line-height:1.25}

.stat-list{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.stat{display:flex;align-items:baseline;gap:8px;font-size:13px}
.stat__k{color:var(--ink-2);white-space:nowrap}
.stat__line{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px)}
.stat__v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat__v--good{color:var(--green-deep)}
.stat__v--warn{color:var(--amber)}

/* Полоса */
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.bar__fill{display:block;height:100%;border-radius:99px;background:var(--green);width:0;transition:width 1s cubic-bezier(.22,1,.36,1) .2s}
.bar.is-drawn .bar__fill{width:var(--pct,50%)}
.bar--warn .bar__fill{background:var(--amber-solid)}
.card--green .bar{background:var(--green-line)}
.card--warn .bar{background:var(--amber-line)}
.bar-legend{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3);margin-top:8px}

.reward{
  display:flex;align-items:flex-start;gap:10px;margin-top:13px;
  padding-top:13px;border-top:1px dashed var(--green-line);
  font-size:12.5px;color:var(--ink-2);line-height:1.45;
}
.card--warn .reward{border-top-color:var(--amber-line)}
.reward svg{width:16px;height:16px;flex:none;color:var(--green-deep);margin-top:1px}
.card--warn .reward svg{color:var(--amber)}

/* Уровни */
.levels{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.level{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:13.5px;color:var(--ink-3)}
.level__pip{width:22px;height:22px;border-radius:50%;flex:none;position:relative;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.level__pip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);width:2px;height:11px;background:var(--line)}
.level:last-child .level__pip::after{display:none}
.level.done{color:var(--ink-2)}
.level.done .level__pip{background:var(--green);border-color:var(--green);color:var(--on-green)}
.level.done .level__pip::after{background:var(--green)}
.level.done .level__pip svg{width:11px;height:11px}
.level.now{color:var(--ink);font-weight:600}
.level.now .level__pip{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.level.now .level__pip i{width:8px;height:8px;border-radius:50%;background:var(--green);display:block}
.level__meta{margin-left:auto;font-size:12px;font-weight:400;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* Знаки */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.badge{
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px 8px;
  background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:7px;
  text-align:center;transition:transform .18s ease,border-color .18s ease;
}
.badge:hover{transform:translateY(-2px);border-color:var(--green-line)}
.badge[aria-expanded="true"]{border-color:var(--green);background:var(--green-soft)}
.badge__ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--green-soft);color:var(--green-deep)}
.badge__ic svg{width:19px;height:19px}
.badge__n{font-size:10.5px;font-weight:600;line-height:1.25}
.badge.locked{opacity:.62}
.badge.locked .badge__ic{background:var(--line-soft);color:var(--ink-3)}
.badge__how{
  font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:10px;
  padding:11px 13px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line-soft);
}
.badge__how b{color:var(--ink);font-weight:600}

/* Плашка-подсказка */
.note-chip{
  display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:11px 13px;
}
.note-chip svg{width:15px;height:15px;flex:none;color:var(--green-deep);margin-top:2px}
.note-chip--warn{background:var(--amber-soft);border-color:var(--amber-line)}
.note-chip--warn svg{color:var(--amber)}

/* Лига */
.rank{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r-md);font-size:13.5px}
.rank + .rank{margin-top:3px}
.rank__pos{width:24px;flex:none;font-family:var(--display);font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rank__who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank__pts{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.rank.me{background:var(--green-soft);border:1px solid var(--green-line);font-weight:600}
.rank.me .rank__pos,.rank.me .rank__pts{color:var(--green-deep)}
.rank.me--warn{background:var(--amber-soft);border-color:var(--amber-line)}
.rank.me--warn .rank__pos,.rank.me--warn .rank__pts{color:var(--amber)}
.promo-label{font-size:11px;color:var(--green-deep);font-weight:600;text-align:center;padding:8px 0 4px;border-top:1px dashed var(--green-line);margin-top:3px}

/* Команда */
.team-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0}
.team-row + .team-row{border-top:1px solid var(--line-soft)}
.team-row__av{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-2)}
.team-row__n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-row__v{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.team-row.me .team-row__av{background:var(--green-soft);border-color:var(--green-line);color:var(--green-deep)}
.team-row.me .team-row__n{font-weight:600}

/* Слоты и замок */
.unlock{display:flex;gap:12px;align-items:center;padding:14px 15px;border-radius:var(--r-lg);background:var(--green-soft);border:1px solid var(--green-line)}
.unlock--warn{background:var(--amber-soft);border-color:var(--amber-line)}
.unlock--off{background:var(--surface);border-color:var(--line)}
.unlock__ic{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--green);color:var(--on-green)}
.unlock--warn .unlock__ic{background:var(--amber-solid);color:#2A1C05}
.unlock--off .unlock__ic{background:var(--line-soft);color:var(--ink-3)}
.unlock__ic svg{width:19px;height:19px}
.unlock__t{font-size:13.5px;font-weight:600;color:var(--green-deep)}
.unlock--warn .unlock__t{color:var(--amber)}
.unlock--off .unlock__t{color:var(--ink-2)}
.unlock__s{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.4}

.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.slot + .slot{margin-top:7px}
.slot__day{width:52px;flex:none}
.slot__d1{font-size:12.5px;font-weight:600}
.slot__d2{font-size:11px;color:var(--ink-3)}
.slot__time{flex:1;font-size:13.5px;font-variant-numeric:tabular-nums}
.slot__pill{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;background:var(--green-soft);color:var(--green-deep);border:1px solid var(--green-line)}
.slot__pill--muted{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.slot.taken{opacity:.55}

/* Чек-лист новичка */
.check{display:flex;flex-direction:column;margin-top:8px}
.check__i{display:flex;align-items:flex-start;gap:11px;padding:9px 0;font-size:13px;color:var(--ink-2);line-height:1.4}
.check__i + .check__i{border-top:1px solid var(--line-soft)}
.check__box{
  width:20px;height:20px;border-radius:7px;flex:none;margin-top:1px;
  border:1.8px solid var(--line);background:var(--surface);display:grid;place-items:center;
}
.check__i.done .check__box{background:var(--green);border-color:var(--green);color:var(--on-green)}
.check__i.done .check__box svg{width:11px;height:11px}
.check__i.done{color:var(--ink-3)}

/* Наставник */
.mentor{display:flex;align-items:center;gap:13px;margin-top:10px}
.mentor__av{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;background:var(--green-soft);border:1px solid var(--green-line);color:var(--green-deep);font-family:var(--display);font-size:17px;font-weight:600}
.mentor__n{font-size:14.5px;font-weight:600}
.mentor__r{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.mentor__btn{
  margin-left:auto;flex:none;display:grid;place-items:center;
  width:40px;height:40px;border-radius:13px;
  background:var(--green);color:var(--on-green);
}
.mentor__btn svg{width:18px;height:18px}

/* Что подтянуть */
.fix{display:flex;flex-direction:column;gap:11px;margin-top:11px}
.fix__i{display:flex;gap:11px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.fix__n{
  width:22px;height:22px;border-radius:8px;flex:none;margin-top:1px;
  background:var(--amber-line);color:var(--amber);
  display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
}
.fix__i b{color:var(--ink);font-weight:600}
.appeal{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;
  padding:9px 14px;border-radius:100px;
  border:1px solid var(--amber-line);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--amber);
}
.appeal svg{width:14px;height:14px}

/* Таб-бар */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:9px 8px 15px;background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:13px;color:var(--ink-3);transition:color .18s ease,background .18s ease}
.tab svg{width:21px;height:21px;stroke-width:1.7}
.tab span{font-size:9.5px;font-weight:600}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--green-deep);background:var(--green-soft)}

@media (prefers-reduced-motion:reduce){

<script>
(function(){
  "use strict";

  /* ══════════════════════════ ИКОНКИ ══════════════════════════ */
  var ICONS = {
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
    bag:'<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/>',
    pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/>',
    users:'<path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13A4 4 0 0119 7"/>',
    snow:'<path d="M12 2v20M4.9 6.5l14.2 11M19.1 6.5L4.9 17.5"/>',
    check:'<path d="M20 6L9 17l-5-5"/>',
    spark:'<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>',
    lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 019.9-1"/>',
    locked:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
    clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6A19.8 19.8 0 012 4.2 2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1L8 9.5a16 16 0 006 6l1.1-1.1a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0122 16.9z"/>',
    star:'<path d="M12 2l2.9 6.3 6.6.8-4.9 4.5 1.3 6.4L12 16.8 6.1 20l1.3-6.4L2.5 9.1l6.6-.8z"/>',
    box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>'

  function svg(n, w){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.9) +

  }
  function tone(t){
    return t === 'green' ? ' card--green' : t === 'warn' ? ' card--warn' : t === 'flat' ? ' card--flat' : '';
  }

  /* ══════════════════════════ БЛОКИ ══════════════════════════ */
  var BLOCK = {
    live: function(b){
      return '<div class="card' + tone(b.tone) + '">' +
        '<div class="live"><span class="live__dot"></span><span class="live__text">' + b.text +

        (b.note ? '<p class="card__note">' + b.note + '</p>' : '') + '</div>';
    },

    metrics: function(b){
      var dash = Math.round(283 - 283 * b.pct / 100);

        '<p class="card__label">' + b.label + '</p>' +
        '<div class="ring-row"><div class="ring' + (b.tone === 'warn' ? ' ring--warn' : '') + '" style="--dash:' + dash + '">' +
        '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring__track" cx="50" cy="50" r="45"></circle>' +
        '<circle class="ring__fill" cx="50" cy="50" r="45"></circle></svg>' +
        '<div class="ring__center"><div class="ring__big num">' + b.value + '</div>' +
        '<div class="ring__small">' + b.unit + '</div></div></div>' +
        '<ul class="stat-list">' + b.stats.map(function(s){
          return '<li class="stat"><span class="stat__k">' + s.k + '</span><span class="stat__line"></span>' +
                 '<span class="stat__v' + (s.mood ? ' stat__v--' + s.mood : '') + ' num">' + s.v + '</span></li>';
        }).join('') + '</ul></div></div>';
    },

    goal: function(b){
      return '<div class="card' + tone(b.tone) + '">' +
        '<p class="card__label">' + b.label + '</p>' +
        '<p class="card__title' + (b.big ? ' card__title--lg' : '') + '">' + b.title + '</p>' +

    },

    card: function(b){
      return '<div class="card' + tone(b.tone) + '">' +
        (b.label ? '<p class="card__label">' + b.label + '</p>' : '') +
        (b.title ? '<p class="card__title' + (b.big ? ' card__title--lg' : '') + '">' + b.title + '</p>' : '') +
        (b.note ? '<p class="card__note">' + b.note + '</p>' : '') + '</div>';
    },

    note: function(b){
      return '<p class="note-chip' + (b.tone === 'warn' ? ' note-chip--warn' : '') + '">' +
        svg(b.icon || 'info', 2) + '<span>' + b.text + '</span></p>';
    },

    myrank: function(b){
      return '<div class="card card--flat"><p class="card__label">' + b.label + '</p>' +
        '<div class="rank me' + (b.tone === 'warn' ? ' me--warn' : '') + '" style="margin-top:10px">' +
        '<span class="rank__pos num">' + b.pos + '</span><span class="rank__who">' + b.who + '</span>' +
        '<span class="rank__pts num">' + b.pts + '</span></div>' +
        (b.note ? '<p class="card__note">' + b.note + '</p>' : '') + '</div>';
    },

    levels: function(b){
      return '<div class="card"><p class="card__label">' + b.label + '</p><ul class="levels">' +
        b.items.map(function(l){
          var inner = l.state === 'done' ? svg('check', 3.5) : l.state === 'now' ? '<i></i>' : '';
          return '<li class="level ' + (l.state || '') + '"><span class="level__pip">' + inner + '</span>' +
                 l.name + '<span class="level__meta num">' + l.meta + '</span></li>';
        }).join('') + '</ul>' +
        (b.note ? '<p class="card__note">' + b.note + '</p>' : '') + '</div>';
    },

    badges: function(b){
      return '<div class="card"><p class="card__label">' + b.label + '</p><div class="badges">' +
        b.items.map(function(x){
          return '<button class="badge' + (x.locked ? ' locked' : '') + '" type="button" aria-expanded="false" ' +
                 'data-how="' + x.how.replace(/"/g, '&quot;') + '">' +
                 '<span class="badge__ic">' + svg(x.icon) + '</span>' +
                 '<span class="badge__n">' + x.name + '</span></button>';
        }).join('') + '</div><div class="badge__how" data-how-box hidden></div></div>';
    },

    board: function(b){
      return '<div class="card" style="padding:12px">' + b.rows.map(function(r){
        var cls = r.me ? ' me' + (b.tone === 'warn' ? ' me--warn' : '') : '';
        return '<div class="rank' + cls + '"><span class="rank__pos num">' + r.pos + '</span>' +
               '<span class="rank__who">' + r.who + '</span><span class="rank__pts num">' + r.pts + '</span></div>' +
               (r.cut ? '<p class="promo-label">' + b.cutLabel + '</p>' : '');
      }).join('') + '</div>';
    },

    stats: function(b){
      return '<div class="card"><p class="card__label">' + b.label + '</p>' +
        '<ul class="stat-list" style="margin-top:12px">' + b.items.map(function(s){
          return '<li class="stat"><span class="stat__k">' + s.k + '</span><span class="stat__line"></span>' +
                 '<span class="stat__v num">' + s.v + '</span></li>';
        }).join('') + '</ul>' +
        (b.note ? '<p class="card__note">' + b.note + '</p>' : '') + '</div>';
    },

    contrib: function(b){
      return '<div class="card"><p class="card__label">' + b.label + '</p><div style="margin-top:8px">' +
        b.rows.map(function(r){
          return '<div class="team-row' + (r.me ? ' me' : '') + '"><span class="team-row__av">' + r.av + '</span>' +
                 '<span class="team-row__n">' + r.name + '</span><span class="team-row__v num">' + r.val + '</span></div>';
        }).join('') + '</div>' +
        (b.note ? '<p class="card__note">' + b.note + '</p>' : '') + '</div>';
    },

    unlock: function(b){
      var mod = b.state === 'warn' ? ' unlock--warn' : b.state === 'off' ? ' unlock--off' : '';
      return '<div class="unlock' + mod + '"><span class="unlock__ic">' +
        svg(b.state === 'off' ? 'locked' : 'lock', 2) + '</span><div>' +
        '<p class="unlock__t">' + b.title + '</p><p class="unlock__s">' + b.sub + '</p></div></div>';
    },

    slots: function(b){
      return '<div class="card card--flat"><p class="card__label">' + b.label + '</p><div style="margin-top:12px">' +
        b.rows.map(function(s){
          var taken = s.state === 'taken';
          return '<div class="slot' + (taken ? ' taken' : '') + '">' +

                 '<span class="slot__time num">' + s.time + '</span>' +
                 '<span class="slot__pill' + (taken ? ' slot__pill--muted' : '') + '">' + (taken ? 'Занят' : 'Взять') + '</span></div>';
        }).join('') + '</div></div>';
    },

    checklist: function(b){
      var done = b.items.filter(function(i){ return i.done; }).length;
      return '<div class="card"><p class="card__label">' + b.label + '</p>' +
        '<p class="card__title">' + b.title + '</p>' +
        '<div class="bar" style="--pct:' + Math.round(done / b.items.length * 100) + '%"><span class="bar__fill"></span></div>' +
        '<div class="bar-legend"><span class="num">' + done + ' из ' + b.items.length + '</span><span>' + b.right + '</span></div>' +
        '<div class="check">' + b.items.map(function(i){
          return '<div class="check__i' + (i.done ? ' done' : '') + '"><span class="check__box">' +
                 (i.done ? svg('check', 3.5) : '') + '</span><span>' + i.text + '</span></div>';
        }).join('') + '</div></div>';
    },

    mentor: function(b){
      return '<div class="card"><p class="card__label">' + b.label + '</p>' +
        '<div class="mentor"><span class="mentor__av">' + b.initial + '</span>' +
        '<div><p class="mentor__n">' + b.name + '</p><p class="mentor__r">' + b.role + '</p></div>' +
        '<span class="mentor__btn">' + svg('phone', 2) + '</span></div>' +
        (b.note ? '<p class="card__note">' + b.note + '</p>' : '') + '</div>';
    },

    fix: function(b){
      return '<div class="card card--warn"><p class="card__label">' + b.label + '</p>' +
        '<p class="card__title">' + b.title + '</p>' +
        '<div class="fix">' + b.items.map(function(t, i){
          return '<div class="fix__i"><span class="fix__n num">' + (i + 1) + '</span><span>' + t + '</span></div>';
        }).join('') + '</div>' +
        (b.note ? '<p class="card__note">' + b.note + '</p>' : '') +
        (b.appeal ? '<button class="appeal" type="button">' + svg('alert', 2) + b.appeal + '</button>' : '') + '</div>';
    }
  };

  /* ══════════════════════════ ОБЩИЕ КУСКИ ══════════════════════════ */
  var PATH = [
    { name: 'Новичок', meta: '10 смен' },
    { name: 'Свой человек', meta: '30 смен' },

    { name: 'Наставник', meta: '180 смен' },
    { name: 'Опора точки', meta: '360 смен' }

  }

    care:   { icon: 'shield', name: 'Бережная<br>доставка', how: '<b>Бережная доставка.</b> 100 заказов подряд без повреждений и жалоб на состояние продуктов.' },

    tare:   { icon: 'bag',    name: 'Тара<br>на месте',     how: '<b>Тара на месте.</b> Все термосумки и пакеты вернулись на точку три недели подряд.' },
    local:  { icon: 'pin',    name: 'Знаток<br>района',     how: '<b>Знаток района.</b> 200 доставок в одном районе. Ты знаешь домофоны, дворы и где не проехать.' },
    mentor: { icon: 'users',  name: 'Наставник<br>1 из 3',  how: '<b>Наставник.</b> Провести трёх новичков через первую неделю. Пока — один из трёх.' },
    winter: { icon: 'snow',   name: 'Зимний<br>курьер',     how: '<b>Зимний курьер.</b> 40 смен при температуре ниже −10 °C. Открывается с декабря.' }
  };
  function badge(key, locked, name){
    var b = BADGE[key];
    return { icon: b.icon, name: name || b.name, how: b.how, locked: !!locked };
  }

  var WEEK_SLOTS = [
    { d1: 'Пн', d2: '1 сент', time: '09:00 — 15:00' },
    { d1: 'Вт', d2: '2 сент', time: '14:00 — 20:00' },
    { d1: 'Ср', d2: '3 сент', time: '09:00 — 15:00' },
    { d1: 'Чт', d2: '4 сент', time: '14:00 — 20:00', state: 'taken' },
    { d1: 'Пт', d2: '5 сент', time: '09:00 — 15:00' }
  ];

  /* ══════════════════════════ ПРОФИЛИ ══════════════════════════ */
  var PROFILES = {

    /* ── Первая неделя: лиг нет, есть наставник и чек-лист ── */

      who: { title: 'Привет, Айгуль', sub: 'Профсоюзная, 43 · 4-й день', initial: 'А' },
      screens: {
        shift: {
          head: ['Привет, Айгуль', 'Профсоюзная, 43 · 4-й день'],
          blocks: [
            { type: 'live', tone: 'green', text: 'Смена идёт', meta: 'до 15:00',
              note: '3 заказа из 8. Первая неделя короткая — спешить некуда, спрашивай что угодно.' },
            { type: 'mentor', label: 'Твой наставник', initial: 'Т', name: 'Тимур Ахмедов', role: 'Знаток района · 4 года на точке',
              note: 'Пишет и берёт трубку в любое время смены. За тебя ему идёт знак «Наставник».' },
            { type: 'checklist', label: 'Первые две недели', title: 'Освоиться без спешки', right: 'до 10 сентября',
              items: [
                { done: true,  text: 'Собрать заказ по списку и сверить состав' },
                { done: true,  text: 'Проверить сроки годности при сборке' },
                { done: true,  text: 'Оформить возврат прямо у двери' },

  /* ══════════════════════════ НАВИГАЦИЯ ══════════════════════════ */
  var ORDER = ['shift', 'progress', 'league', 'team', 'slots'];
  var LABEL = { shift: 'Смена', progress: 'Прогресс', league: 'Лига', team: 'Команда', slots: 'Слоты' };

  var tabs     = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var profiles = Array.prototype.slice.call(document.querySelectorAll('.profile'));
  var viewport = document.getElementById('viewport');
  var barTitle = document.getElementById('barTitle');
  var barSub   = document.getElementById('barSub');
  var avatar   = document.getElementById('avatar');
  var announce = document.getElementById('announce');

  var profile = 'steady';
  var screen  = 'shift';

  function render(dir){
    var data = PROFILES[profile].screens[screen];
    var html = data.blocks.map(function(b){
      var fn = BLOCK[b.type];
      return fn ? fn(b) : '';
    }).join('');

    viewport.innerHTML = '<section class="screen" id="panel" role="tabpanel" aria-labelledby="t-' + screen +
                         '" style="--from:' + (dir || '10px') + '">' + html + '</section>';
    barTitle.textContent = data.head[0];
    barSub.textContent   = data.head[1];
    avatar.textContent   = PROFILES[profile].who.initial;
    viewport.scrollTop = 0;

    // Кольца и полосы рисуются после вставки в документ, иначе перехода не будет
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        viewport.querySelectorAll('.ring, .bar').forEach(function(el){ el.classList.add('is-drawn'); });
      });
    });
  }

  function showScreen(key, dir){
    if (ORDER.indexOf(key) < 0 || key === screen) return;
    var d = dir || (ORDER.indexOf(key) > ORDER.indexOf(screen) ? '18px' : '-18px');
    screen = key;
    tabs.forEach(function(t){
      var on = t.dataset.screen === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    render(d);
    announce.textContent = LABEL[key];
  }

  function showProfile(key){
    if (!PROFILES[key] || key === profile) return;
    profile = key;
    profiles.forEach(function(p){
      p.setAttribute('aria-pressed', p.dataset.profile === key ? 'true' : 'false');
    });
    render('0px');
    announce.textContent = 'Состояние: ' + document.querySelector('.profile[aria-pressed="true"]').textContent +
                           '. Экран: ' + LABEL[screen];
  }

  function step(delta){
    var i = ORDER.indexOf(screen) + delta;
    if (i < 0 || i >= ORDER.length) return;
    showScreen(ORDER[i]);
  }

  tabs.forEach(function(t){ t.addEventListener('click', function(){ showScreen(t.dataset.screen); }); });
  profiles.forEach(function(p){ p.addEventListener('click', function(){ showProfile(p.dataset.profile); }); });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  });

  /* Свайп по области экрана */
  var x0 = null, y0 = null;
  viewport.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  viewport.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* Знаки: раскрытие условия. Делегируем — разметка пересобирается на каждый рендер */
  viewport.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.badge') : null;
    if (!b) return;
    var box = viewport.querySelector('[data-how-box]');
    var wasOpen = b.getAttribute('aria-expanded') === 'true';
    viewport.querySelectorAll('.badge').forEach(function(x){ x.setAttribute('aria-expanded', 'false'); });
    if (wasOpen) { box.hidden = true; box.innerHTML = ''; return; }
    b.setAttribute('aria-expanded', 'true');
    box.innerHTML = b.dataset.how;
    box.hidden = false;
  });

  render();
})();
</script>
